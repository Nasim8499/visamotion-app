egister a company in Singapore?"},{t:"p",x:"Singapore is a well-connected business hub with an established regulatory framework, access to international markets, and a straightforward online company registration process. Both local and foreign founders can start a private limited company."},{t:"p",x:"A private limited company is a separate legal entity from its owners. This structure can make it easier to bring in shareholders, raise investment, and grow your business."},{t:"h2",x:"What you need before you incorporate"},{t:"p",x:"Prepare the key details of your company before submitting your application to the Accounting and Corporate Regulatory Authority (ACRA). Having your documents ready helps keep the process moving."},{t:"li",x:"An available company name"},{t:"li",x:"At least one shareholder and one resident director"},{t:"li",x:"A local registered office address"},{t:"li",x:"A company constitution"},{t:"li",x:"A description of your business activity and the relevant SSIC code"},{t:"li",x:"Identity and address documents for directors and shareholders"},{t:"h2",x:"Choose and reserve your company name"},{t:"p",x:"Choose a name that represents your business and meets ACRA requirements. Your proposed name should not be identical to an existing registered name, prohibited, or undesirable."},{t:"p",x:"Some names or activities require approval from another authority. This can add to the processing time. A reserved company name is normally held for 120 days."},{t:"h2",x:"Prepare your registration documents"},{t:"p",x:"Your incorporation documents set out the structure and rules of your company. They include your constitution, consent from directors, and details of your shareholders and share capital."},{t:"p",x:"A registered corporate service provider can prepare and submit the application for you. Foreign founders generally need to engage a registered filing agent."},{t:"h2",x:"Register your company with ACRA"},{t:"p",x:"Once the documents are in order, the applicatio Can I use VisaMOTion365 from anywhere?",a:"Yes. Our services are fully online. Send us your records in whichever format you have them. Drop your files in our app, store them in a cloud, or send them to us via live chat. Your documents and business finances are available on iOS, Android, and the web."},{q:"How do I register a company in Singapore?",a:"Choose your company name and business activity, and provide details of the directors and shareholders. Our experts prepare your company constitution and incorporation documents, complete compliance checks, and submit your application to ACRA. Once your Unique Entity Number (UEN) is issued, your company is ready to operate."},{q:"How long does incorporation take?",a:"Most companies are incorporated in 1 to 3 business days once all required documents are received. The most important factor is collecting all the documents. Keep in mind that the authorities only process registrations during working hours, and some business activities may require additional approval."},{q:"Do I need a company address?",a:"Yes, all Singaporean companies must have a local registered address. It goes on all legal documents. If you do not have an office address, use our service. We handle your incoming letters, scan and store them in your VisaMOTion365 account so you have easy access to all your documents."},{q:"Can I get incorporation services only?",a:"In Singapore every company is required to appoint a company secretary within six months of incorporation. Our incorporation packages include corporate secretary services from day one to ensure your company is registered correctly and remains compliant. This also keeps the process simple and helps you avoid additional secretary-related costs later on."},{q:"Are there any hidden fees or extra charges?",a:"No hidden fees. Government and third-party fees, like ACRA charges, appear in the price breakdown. Optional extras and ad-hoc work are quoted before you confirm. Services such as a registered address and CorpPass registration are available as clearly priced add-ons."},{q:"How does accounting work?",a:"Accounting tracks all your business activities and assets. Whenever you spend, lose or make money, your bookkeeper adds it to your records. Your accountant then builds reports using these numbers. The government requests these reports to calculate how much tax you owe and whether you are exempted from some of it."},{q:"Why is accounting important?",a:"First of all, you have an obligation to report your accounts to the government: that is how your tax is calculated. Secondly, accounting is crucial for internal planning and management. Mistakes could be costly: the government can fine business owners for inaccurate reports. Making sure your accounting is accurate is crucial."},{q:"What are the accounting standards in Singapore?",a:"Singapore has its own system called Singapore Financial Reporting Standards (SFRS). It is similar to IFRS and it is accrual-based accounting. This means transactions are recognised when they occur and not when the money is paid. Outsourced accounting services in Singapore must comply with SFRS requirements."},{q:"What accounting services do you have for small businesses?",a:"We help small businesses in Singapore with all necessary accounting services. We prepare financial statements, ECI tax reports, XBRL (full and highlights), and handle bookkeeping. We can apply for GST registration and submit regular reports for GST-registered companies. If your case is special, let us know and our specialists will be happy to help."},{q:"In what form should I submit my data?",a:"VisaMOTion365 is an online accounting company. Send us your records in whichever format you have them. Drop your files in our app, store them in a cloud, send them to us via live chat or email to our experts. We'll take care of the rest."},{q:"Can I use my own accounting software or Xero account?",a:"Yes. If you already use Xero, grant our accountants access and we will manage bookkeeping there. You keep paying Xero's subscription separately. If you prefer, you can use VisaMOTion365's software, which is included with our accounting packages for small business clients."},{q:"What if my actual annual revenue differs from my chosen accounting plan's revenue range?",a:"No worries! We'll adjust your accounting plan to match your actual revenue, either by sending you an invoice for the pro-rated package or crediting the amount back to your account."},{q:"What are corporate secretarial services?",a:"Corporate secretarial services ensure compliance with legal and regulatory obligations, helping businesses avoid penalties and legal risks. Company secretaries handle important administrative tasks such as maintaining statutory registers, filing annual returns, and organising board meetings, ensuring that the company operates within the bounds of the law."},{q:"Does every Singapore company need a company secretary?",a:"Yes. A Singapore company must appoint a company secretary within six months of incorporation. The secretary must be ordinarily resident in Singapore and have the knowledge and experience necessary to carry out their duties. A sole director cannot also act as the company secretary."},{q:"What is included in the Essential plan?",a:"The Essential plan includes expert support via in-app chat, preparation and filing of your Annual Return including the S$ 60 government fee, holding your Annual General Meeting, and secure document storage in the VisaMOTion365 app."},{q:"Can I transfer my company secretary to VisaMOTion365?",a:"Yes. We guide you through the transfer process, help arrange the necessary documents, and update your company records. Your new secretary will help you keep track of upcoming filings and ensure a smooth handover."},{q:"When do I need to file my annual return?",a:"Companies in Singapore generally have to file annual returns within seven months of the end of their financial year. Your company secretary keeps track of the relevant dates and prepares the documents for your review and approval."},{q:"Still have a question?",a:"Let's talk. Our team will help you find the clarity you need."}],gc=an["/"],gk="Hassle-free incorporation and expert accounting for better businesses",xk="Start your business with fast online company incorporation. Plus a bank account and registered address from day one. Then keep it compliant with accountants who know your numbers.",eg=[P2,Yx,$2,Q2,ok,Z2],tg=["from-[#cfe4ff] to-[#eaf3ff] text-[#0063d1]","from-[#e0d8ff] to-[#f0ecff] text-[#5b3df0]","from-[#d3f2ff] to-[#ecfaff] text-[#0079a8]","from-[#ffe3ef] to-[#fff0f6] text-[#c0186a]","from-[#d9f7e4] to-[#eefdf3] text-[#0f7a3d]","from-[#ffeacc] to-[#fff6e8] text-[#a35b00]"];function ar({value:a,label:o}){return x.jsxs("div",{className:"rounded-2xl border border-white/70 bg-white/60 px-3 py-4 text-center backdrop-blur-xl",children:[x.jsx("p",{className:"text-[24px] font-bold tracking-[-0.03em] sm:text-[30px]",children:a}),x.jsx("p",{className:"mt-1 text-[11.5px] leading-tight text-[var(--muted)]",children:o})]})}function vk(){const a=gc.blocks.filter(o=>o.t==="h3"&&o.x.length<46).slice(0,2);return x.jsxs(x.Fragment,{children:[x.jsx("section",{className:"px-2.5",children:x.jsx("div",{className:"panel overflow-hidden !p-0",children:x.jsxs("div",{className:"relative px-5 pb-7 pt-8 text-center sm:px-10 sm:pb-10 sm:pt-12",children:[x.jsx("div",{className:"pointer-events-none absolute inset-x-0 -top-24 h-64 opacity-70",style:{background:"radial-gradient(60% 100% at 50% 0%, rgba(0,122,255,0.22), transparent 70%)"}}),x.jsx("p",{className:"eyebrow",children:"Singapore · Incorporation & accounting"}),x.jsx("h1",{className:"h1 mx-auto mt-4 max-w-[860px]",children:gk}),x.jsx("p",{className:"lead mx-auto mt-4 max-w-[600px]",children:xk}),x.jsxs("div",{className:"mt-6 flex flex-wrap items-center justify-center gap-3",children:[x.jsx(Ne,{to:"/contact-us",className:"btn btn-primary",children:"Get started"}),x.jsxs(Ne,{to:"
